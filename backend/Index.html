<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #3498db;
      --success: #2ecc71;
      --warning: #f39c12;
      --danger: #e74c3c;
      --info: #9b59b6;
      --light: #ecf0f1;
      --dark: #2c3e50;
    }

    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; height: 95vh; }

    .header { background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card .number { font-size: 2.5rem; font-weight: bold; color: var(--primary); }
    .number.urgent { color: var(--danger); }

    .content { display: flex; flex: 1; gap: 20px; overflow: hidden; }
    .sidebar { width: 250px; background: white; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar button { padding: 12px; border: none; background: none; text-align: left; cursor: pointer; border-radius: 5px; color: #555; }
    .sidebar button:hover, .sidebar button.active { background: #e8f4fc; color: var(--primary); font-weight: 600; }

    .main-content { flex: 1; background: white; padding: 25px; border-radius: 10px; overflow-y: auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .data-table th, .data-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    .data-table th { background: #f8f9fa; }

    .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; background: #e0e0e0; }
    .btn-success { background: var(--success); color: white; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; padding: 30px; border-radius: 10px; width: 500px; max-width: 90%; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }

    .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 0.85em; background: #eee; }
    .store-code { background: #e8f4fc; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-building"></i> Client Follow-up Monitor</h1>
      <div>
        <button onclick="exportData()" class="btn"><i class="fas fa-download"></i> Export</button>
      </div>
    </div>

    <div id="statsGrid" class="stats-grid"></div>

    <div class="content">
      <div class="sidebar">
        <button onclick="showTab('dashboard')" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
        <button onclick="showTab('clients')"><i class="fas fa-users"></i> All Clients</button>
        <button onclick="showTab('due')"><i class="fas fa-bell"></i> Due Today <span id="dueBadge"></span></button>
        <button onclick="showTab('overdue')"><i class="fas fa-exclamation-triangle"></i> Overdue <span id="overdueBadge"></span></button>
      </div>

      <div class="main-content">
        <div id="dashboardTab" class="tab-content active">
          <h2>Dashboard</h2>
          <div id="dashboardContent"></div>
        </div>

        <div id="clientsTab" class="tab-content">
          <div style="display:flex; justify-content:space-between; flex-wrap: wrap; gap: 10px; align-items: center;">
            <h2>All Clients</h2>
            <div style="display:flex; gap:10px;">
              <select id="picFilter" onchange="filterClients()" style="padding:8px; border-radius:5px; border:1px solid #ddd;">
                <option value="">All PICs</option>
              </select>
              <select id="progressFilter" onchange="filterClients()" style="padding:8px; border-radius:5px; border:1px solid #ddd;">
                <option value="">All Progress</option>
                <option value="PERKENALAN">PERKENALAN</option>
                <option value="PENDEKATAN">PENDEKATAN</option>
                <option value="TERHUBUNG">TERHUBUNG</option>
              </select>
              <input type="text" id="searchClients" placeholder="Search..." onkeyup="filterClients()" style="padding:8px; border-radius:5px; border:1px solid #ddd;">
            </div>
          </div>
          <div id="clientsContent"></div>
        </div>

        <div id="dueTab" class="tab-content">
          <h2>Due Today</h2>
          <div id="dueContent"></div>
        </div>

        <div id="overdueTab" class="tab-content">
          <h2>Overdue</h2>
          <div id="overdueContent"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Record Follow-up Modal -->
  <div id="followupModal" class="modal">
    <div class="modal-content">
      <h2>Record Follow-up</h2>
      <div id="followupClientInfo" style="background:#f8f9fa; padding:10px; margin-bottom:15px; border-radius:5px;"></div>

      <form id="followupForm">
        <input type="hidden" id="followupClientRow">

        <div class="form-group">
          <label>Follow-up Date</label>
          <input type="date" id="followupDate" required>
        </div>

        <div class="form-group">
          <label>Type</label>
          <select id="followupType">
            <option value="Call">Phone Call</option>
            <option value="Message">Message (WA)</option>
            <option value="Email">Email</option>
            <option value="Visit">Visit</option>
          </select>
        </div>

        <div class="form-group">
          <label>Feedback</label>
          <select id="followupNotes" required>
            <option value="">-- Select Feedback --</option>
            <option value="CUSTOMER MEMINTA CATALOGUE">CUSTOMER MEMINTA CATALOGUE</option>
            <option value="SAY THANKYOU">SAY THANKYOU</option>
            <option value="NO RESPON">NO RESPON</option>
            <option value="BERSEDIA DIFOLLOW UP LEBIH LANJUT">BERSEDIA DIFOLLOW UP LEBIH LANJUT</option>
          </select>
        </div>

        <div class="form-group">
          <label>Progress</label>
          <select id="followupProgress" required>
            <option value="">-- Select Progress --</option>
            <option value="PERKENALAN">PERKENALAN</option>
            <option value="PENDEKATAN">PENDEKATAN</option>
            <option value="TERHUBUNG">TERHUBUNG</option>
          </select>
        </div>

        <div class="form-group">
          <label>Status</label>
          <input type="text" value="LEADS" disabled style="background:#eee;">
        </div>

        <div class="form-group">
          <label><input type="checkbox" id="sendEmail"> Send Email Notification</label>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <button type="button" class="btn" onclick="closeModal('followupModal')">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Client Details Modal -->
  <div id="clientDetailsModal" class="modal">
    <div class="modal-content" style="max-width:800px;">
      <h2>Client History</h2>
      <div id="clientDetailsContent"></div>
      <div style="text-align:center; margin-top:20px;">
        <button class="btn" onclick="closeModal('clientDetailsModal')">Close</button>
      </div>
    </div>
  </div>

  <script>
    let allClients = [];
    let currentStats = null;

    function init() {
      document.getElementById('followupDate').valueAsDate = new Date();
      loadDashboard();
      loadClients();

      document.getElementById('followupForm').onsubmit = (e) => {
        e.preventDefault();
        saveFollowup();
      };
    }

    function loadDashboard() {
      google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(showError)
        .getDashboardStats();
    }

    function loadClients() {
      const container = document.getElementById('clientsContent');
      container.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
      google.script.run
        .withSuccessHandler(clients => {
          allClients = clients;
          populateFilters();
          renderTable(clients, 'clientsContent');
          loadDueClients();
          loadOverdueClients();
        })
        .withFailureHandler(showError)
        .getAllClients();
    }

    function populateFilters() {
      const picSelect = document.getElementById('picFilter');
      // Keep first option (All PICs)
      picSelect.innerHTML = '<option value="">All PICs</option>';

      const pics = [...new Set(allClients.map(c => c.pic).filter(p => p))].sort();
      pics.forEach(pic => {
        const opt = document.createElement('option');
        opt.value = pic;
        opt.textContent = pic;
        picSelect.appendChild(opt);
      });
    }

    function loadDueClients() {
      google.script.run.withSuccessHandler(c => renderTable(c, 'dueContent')).getClientsNeedingFollowup();
    }

    function loadOverdueClients() {
      const overdue = allClients.filter(c => c.overdueFollowUps > 0);
      renderTable(overdue, 'overdueContent');
    }

    function renderDashboard(stats) {
      currentStats = stats;
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="number">${stats.totalClients}</div><div>Total Clients</div></div>
        <div class="stat-card"><div class="number ${stats.dueFollowups>0?'urgent':''}">${stats.dueFollowups}</div><div>Due Today</div></div>
        <div class="stat-card"><div class="number ${stats.overdueClients>0?'urgent':''}">${stats.overdueClients}</div><div>Overdue</div></div>
        <div class="stat-card">
           <div class="number">${stats.followUpPercentage}%</div>
           <div style="font-size:0.9em; color:#777;">Follow-up Contribution</div>
        </div>
      `;

      let html = '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">';

      // Progress Breakdown
      html += '<div style="background:white; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">';
      html += '<h3 style="margin-top:0; color:#3498db;">Progress Breakdown</h3>';
      for (const [prog, count] of Object.entries(stats.progressCounts)) {
        const pct = ((count / stats.totalClients) * 100).toFixed(1);
        html += `
          <div style="margin-bottom:15px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
              <strong>${prog}</strong>
              <span>${count} (${pct}%)</span>
            </div>
            <div style="background:#eee; height:8px; border-radius:4px; overflow:hidden;">
              <div style="background:#3498db; height:100%; width:${pct}%;"></div>
            </div>
          </div>`;
      }
      html += '</div>';

      // Feedback Breakdown
      html += '<div style="background:white; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">';
      html += '<h3 style="margin-top:0; color:#2ecc71;">Feedback Breakdown</h3>';
      for (const [fb, count] of Object.entries(stats.feedbackCounts)) {
         const pct = ((count / stats.totalClients) * 100).toFixed(1);
         html += `
          <div style="margin-bottom:15px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
              <span style="font-size:0.9em;">${fb}</span>
              <span>${count}</span>
            </div>
            <div style="background:#eee; height:8px; border-radius:4px; overflow:hidden;">
              <div style="background:#2ecc71; height:100%; width:${pct}%;"></div>
            </div>
          </div>`;
      }
      html += '</div>';

      html += '</div>';

      // Detailed Breakdown Section
      html += `
        <div style="margin-top:30px; background:white; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>Detailed Statistics</h3>
            <div>
              <button class="btn" onclick="renderBreakdown('store')" id="btnStoreStats">By Store</button>
              <button class="btn" onclick="renderBreakdown('pic')" id="btnPicStats">By PIC</button>
            </div>
          </div>
          <div id="breakdownContent"></div>
        </div>
      `;

      document.getElementById('dashboardContent').innerHTML = html;

      // Default view
      renderBreakdown('store');
    }

    function renderBreakdown(type) {
       const btnStore = document.getElementById('btnStoreStats');
       const btnPic = document.getElementById('btnPicStats');

       if (type === 'store') {
          btnStore.classList.add('btn-success');
          btnPic.classList.remove('btn-success');
       } else {
          btnStore.classList.remove('btn-success');
          btnPic.classList.add('btn-success');
       }

       const data = type === 'store' ? currentStats.storeStats : currentStats.picStats;
       if (!data) return;

       const keys = Object.keys(data).sort();

         if (keys.length === 0) {
           document.getElementById('breakdownContent').innerHTML = '<p>No data available.</p>';
           return;
         }

         // 1. Overview Table
         let html = '<h4>Overview</h4><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Entity</th><th>Total Leads</th><th>Contribution %</th><th>Due Today</th><th>Overdue</th></tr></thead><tbody>';
         keys.forEach(k => {
            const d = data[k];
            html += `<tr>
              <td><strong>${k}</strong></td>
              <td>${d.total}</td>
              <td>${d.contribution}%</td>
              <td>${d.dueToday}</td>
              <td style="${d.overdue>0?'color:red; font-weight:bold;':''}">${d.overdue}</td>
            </tr>`;
         });
         html += '</tbody></table></div>';

         // 2. Progress Breakdown
         const allProgress = new Set();
         keys.forEach(k => {
             if(data[k].progress) Object.keys(data[k].progress).forEach(p => allProgress.add(p));
         });
         const progCols = Array.from(allProgress).sort();

         html += '<h4 style="margin-top:20px;">Progress Breakdown</h4><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Entity</th>';
         progCols.forEach(p => html += `<th>${p}</th>`);
         html += '</tr></thead><tbody>';

         keys.forEach(k => {
            html += `<tr><td><strong>${k}</strong></td>`;
            progCols.forEach(p => {
               const val = (data[k].progress && data[k].progress[p]) || 0;
               html += `<td>${val}</td>`;
            });
            html += '</tr>';
         });
         html += '</tbody></table></div>';

         // 3. Feedback Breakdown
         const allFeedback = new Set();
         keys.forEach(k => {
             if(data[k].feedback) Object.keys(data[k].feedback).forEach(f => allFeedback.add(f));
         });
         const feedCols = Array.from(allFeedback).sort();

         html += '<h4 style="margin-top:20px;">Feedback Breakdown</h4><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Entity</th>';
         feedCols.forEach(f => html += `<th>${f}</th>`);
         html += '</tr></thead><tbody>';

         keys.forEach(k => {
            html += `<tr><td><strong>${k}</strong></td>`;
            feedCols.forEach(f => {
               const val = (data[k].feedback && data[k].feedback[f]) || 0;
               html += `<td>${val}</td>`;
            });
            html += '</tr>';
         });
         html += '</tbody></table></div>';

         document.getElementById('breakdownContent').innerHTML = html;
    }

    function renderTable(clients, containerId) {
      const div = document.getElementById(containerId);
      if (!clients.length) { div.innerHTML = 'No data.'; return; }

      let html = `<table class="data-table"><thead><tr>
        <th>ID</th><th>Name</th><th>PIC</th><th>Phone</th><th>Status</th><th>Progress</th><th>Latest Feedback</th><th>Next Follow-up</th><th>Follow-ups</th><th>Actions</th>
      </tr></thead><tbody>`;

      clients.forEach(c => {
        const next = c.nextFollowUp ? new Date(c.nextFollowUp).toLocaleDateString() : 'None';
        const urgent = c.overdueFollowUps > 0 ? 'color:red; font-weight:bold;' : '';

        html += `<tr>
          <td><span class="store-code">${c.clientId}</span></td>
          <td>${c.clientName}</td>
          <td>${c.pic || '-'}</td>
          <td>${c.phone}</td>
          <td>${c.status}</td>
          <td>${c.progress || '-'}</td>
          <td>${c.latestFeedback || '-'}</td>
          <td style="${urgent}">${next}</td>
          <td style="text-align: center;"><span style="background: #e8f4fc; padding: 2px 8px; border-radius: 10px; font-weight: bold;">${c.totalFollowUps}</span></td>
          <td>
            <button class="btn" onclick="openFollowup(${c.row})"><i class="fas fa-plus"></i></button>
            <button class="btn" onclick="viewDetails(${c.row})"><i class="fas fa-history"></i></button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      div.innerHTML = html;
    }

    function openFollowup(row) {
      const c = allClients.find(x => x.row === row);
      if (!c) return;

      document.getElementById('followupClientRow').value = row;
      document.getElementById('followupClientInfo').innerHTML = `<strong>${c.clientName}</strong> (${c.clientId})`;
      document.getElementById('followupProgress').value = c.progress || '';

      document.getElementById('followupModal').style.display = 'flex';
    }

    function saveFollowup() {
      const row = document.getElementById('followupClientRow').value;
      const data = {
        date: document.getElementById('followupDate').value,
        type: document.getElementById('followupType').value,
        notes: document.getElementById('followupNotes').value,
        progress: document.getElementById('followupProgress').value,
        status: "LEADS",
        sendEmail: document.getElementById('sendEmail').checked
      };

      google.script.run
        .withSuccessHandler(() => {
          alert('Saved!');
          closeModal('followupModal');
          loadClients(); // Refresh
        })
        .withFailureHandler(showError)
        .recordFollowup(row, data);
    }

    function viewDetails(row) {
      const c = allClients.find(x => x.row === row);
      if (!c) return;

      const detailsHtml = `
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px; background:#f8f9fa; padding:15px; border-radius:5px;">
          <div>
            <p><strong>Name:</strong> ${c.clientName}</p>
            <p><strong>ID:</strong> <span class="store-code">${c.clientId}</span></p>
            <p><strong>PIC:</strong> ${c.pic || '-'}</p>
            <p><strong>Store Code:</strong> ${c.storeCode || '-'}</p>
          </div>
          <div>
            <p><strong>Phone:</strong> ${c.phone || '-'}</p>
            <p><strong>Email:</strong> ${c.email || '-'}</p>
            <p><strong>Address:</strong> ${c.address || '-'}</p>
            <p><strong>Status:</strong> ${c.status}</p>
          </div>
        </div>
        <h3>Follow-up History</h3>
      `;

      google.script.run.withSuccessHandler(history => {
        let html = detailsHtml + '<table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Feedback</th></tr></thead><tbody>';
        if (history.length === 0) {
          html += '<tr><td colspan="3" style="text-align:center;">No history recorded.</td></tr>';
        } else {
          history.forEach(h => {
            html += `<tr>
              <td>${new Date(h.date).toLocaleDateString()}</td>
              <td>Follow-up</td>
              <td>${h.feedback}</td>
            </tr>`;
          });
        }
        html += '</tbody></table>';
        document.getElementById('clientDetailsContent').innerHTML = html;
        document.getElementById('clientDetailsModal').style.display = 'flex';
      }).getClientFollowupHistory(row);
    }

    function filterClients() {
      const term = document.getElementById('searchClients').value.toLowerCase();
      const pic = document.getElementById('picFilter').value;
      const progress = document.getElementById('progressFilter').value;

      const filtered = allClients.filter(c => {
        const matchesTerm = c.clientName.toLowerCase().includes(term) ||
                            c.clientId.toLowerCase().includes(term);
        const matchesPic = !pic || c.pic === pic;
        const matchesProgress = !progress || c.progress === progress;

        return matchesTerm && matchesPic && matchesProgress;
      });
      renderTable(filtered, 'clientsContent');
    }

    function showTab(id) {
      document.querySelectorAll('.tab-content').forEach(d => d.style.display='none');
      document.getElementById(id+'Tab').style.display='block';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showError(e) {
      alert('Error: ' + e.message);
    }

    function exportData() {
       google.script.run.withSuccessHandler(res => {
         // (Simulate download logic)
         alert("Export generated (Simulated download). Filename: " + res.filename);
       }).exportClientData();
    }

    window.onload = init;
  </script>
</body>
</html>
