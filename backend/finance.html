<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Daily Finance Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }

    .nav-btn {
      position: absolute;
      top: 30px;
      left: 30px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      cursor: pointer;
      border: none;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    }

    @media (max-width: 768px) {
      .nav-btn {
        position: static;
        margin-bottom: 20px;
        display: inline-flex;
      }
    }

    .logo {
      font-size: 3em;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2em;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .stat-icon {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #10B981;
      margin: 10px 0;
    }

    .stat-label {
      color: #666;
      font-size: 0.9em;
    }

    .calculator-card {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
    }

    .calculator-card .stat-value, .calculator-card .stat-label {
      color: white;
    }

    .form-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .section-title {
      font-size: 1.5em;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-weight: 600;
      color: #555;
      font-size: 0.9em;
    }

    .input-group input,
    .input-group select {
      padding: 12px;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: white;
    }

    .table-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 15px;
      background: #F9FAFB;
      font-weight: 600;
      color: #374151;
      border-bottom: 2px solid #E5E7EB;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #F3F4F6;
    }

    .type-income {
      color: #10B981;
      font-weight: bold;
    }

    .type-outcome {
      color: #EF4444;
      font-weight: bold;
    }

    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .message-success {
      background: #D1FAE5;
      color: #065F46;
      display: block;
    }

    .message-error {
      background: #FEE2E2;
      color: #991B1B;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <button class="nav-btn" onclick="goToHome()"><i class="fas fa-arrow-left"></i> Back to Debts</button>
      <div class="logo">💸</div>
      <h1>Daily Finance Tracker</h1>
      <p style="color: #666;">Track your income and expenses to discover your true debt repayment capability.</p>

      <div style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="openAddBudgetModal()"><i class="fas fa-plus"></i> Add Budget</button>
        <button class="btn" style="background: #4F46E5; color: white;" onclick="openViewBudgetsModal()"><i class="fas fa-list"></i> View Budgets</button>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div class="section-title" style="color: white;"><i class="fas fa-chart-pie"></i> Smart Dashboard</div>
    <div id="statsContainer" class="stats-grid">
      <!-- Stats loaded dynamically -->
    </div>

    <div class="form-card">
      <div class="section-title">
        <i class="fas fa-plus-circle"></i>
        <span>Add Transaction</span>
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label>Type</label>
          <select id="finType" onchange="toggleCategoryInput()">
            <option value="Income">Income (+)</option>
            <option value="Outcome">Outcome (-)</option>
          </select>
        </div>

        <div class="input-group" id="categoryInputGroup">
          <label>Category</label>
          <input type="text" id="finCategoryText" placeholder="e.g., Salary, Bonus, Investment">
          <select id="finCategorySelect" style="display: none;">
            <option value="" disabled selected>Select Budget...</option>
          </select>
        </div>

        <div class="input-group">
          <label>Amount</label>
          <input type="number" id="finAmount" min="0" step="any" placeholder="Enter amount">
        </div>

        <div class="input-group">
          <label>Note (Optional)</label>
          <input type="text" id="finNote" placeholder="Additional details">
        </div>
      </div>

      <div style="margin-top: 20px;">
        <button class="btn btn-primary" onclick="saveTransaction()" id="saveBtn">
          <i class="fas fa-save"></i> Save Transaction
        </button>
      </div>
    </div>

    <div class="table-container">
      <div class="section-title">
        <i class="fas fa-list"></i>
        <span>Recent Transactions</span>
      </div>
      <div id="recordsContainer">
        <div style="text-align: center; padding: 20px;">Loading transactions...</div>
      </div>
    </div>
  </div>

  <!-- Add Budget Modal -->
  <div id="addBudgetModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%;">
      <h3 style="margin-bottom: 20px;"><i class="fas fa-bullseye"></i> Add Budget Allocation</h3>
      <div class="form-grid" style="text-align: left;">
        <div class="input-group" style="grid-column: 1 / -1;">
          <label>Budget Name (e.g., KPR, Groceries, Emergency)</label>
          <input type="text" id="budgetName" placeholder="Enter budget name">
        </div>
        <div class="input-group" style="grid-column: 1 / -1;">
          <label>Budget Category</label>
          <select id="budgetCategory">
            <option value="Fixed Budget">Fixed Budget (KPR, Rent, Insurance)</option>
            <option value="Variable Budget">Variable Budget (Food, Utilities)</option>
            <option value="Periodic Budget">Periodic Budget (Taxes, Holiday)</option>
            <option value="Saving Budget">Saving Budget (Emergency, Investment)</option>
          </select>
        </div>
        <div class="input-group" style="grid-column: 1 / -1;">
          <label>Allocated Amount</label>
          <input type="number" id="budgetAmount" min="1" step="any" placeholder="Enter amount">
        </div>
      </div>
      <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
        <button class="btn btn-primary" onclick="saveBudget()" id="saveBudgetBtn">Save Budget</button>
        <button class="btn" style="background: #6B7280; color: white;" onclick="closeAddBudgetModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- View Budgets Modal -->
  <div id="viewBudgetsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; border-radius: 20px; padding: 30px; max-width: 800px; width: 95%; max-height: 90vh; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3><i class="fas fa-list-alt"></i> All Budgets</h3>
        <button style="background: none; border: none; font-size: 1.5em; cursor: pointer; color: #666;" onclick="closeViewBudgetsModal()">&times;</button>
      </div>
      <div id="budgetsListContainer" style="overflow-y: auto; flex-grow: 1;">
        <div style="text-align: center; padding: 20px;">Loading budgets...</div>
      </div>
      <div style="display: flex; justify-content: center; margin-top: 20px;">
        <button class="btn" style="background: #6B7280; color: white;" onclick="closeViewBudgetsModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    function showMessage(msg, type) {
      var msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = 'message message-' + type;
      setTimeout(() => {
        msgDiv.className = 'message';
      }, 5000);
    }

    function formatMoney(amount) {
      if (!amount && amount !== 0) return '$0';
      return '$' + amount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      var date = new Date(dateString);
      return date.toLocaleString('en-US');
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function goToHome() {
      google.script.run.withSuccessHandler(function(url) {
        window.top.location.href = url;
      }).getScriptUrl();
    }

    function loadDashboard() {
      google.script.run
        .withSuccessHandler(function(summary) {
          var container = document.getElementById('statsContainer');

          container.innerHTML = `
            <div class="stat-card">
              <div class="stat-icon">💰</div>
              <div class="stat-value">${formatMoney(summary.totalIncome)}</div>
              <div class="stat-label">Total Income</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">🛒</div>
              <div class="stat-value" style="color: #EF4444;">${formatMoney(summary.totalOutcome)}</div>
              <div class="stat-label">Total Outcome</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">⚖️</div>
              <div class="stat-value" style="color: ${summary.netBalance >= 0 ? '#10B981' : '#EF4444'};">${formatMoney(summary.netBalance)}</div>
              <div class="stat-label">Net Balance (Monthly)</div>
            </div>
            <div class="stat-card calculator-card">
              <div class="stat-icon">🚀</div>
              <div class="stat-value">${formatMoney(summary.dailyCapability)}</div>
              <div class="stat-label">Daily Debt Repayment Capability</div>
            </div>
          `;

          // Append budget summary Breakdown
          var budgetHtml = `
            <div class="section-title" style="color: white; margin-top: 30px;"><i class="fas fa-layer-group"></i> Budget Allocation Summary</div>
            <div class="stats-grid">
          `;

          ['Fixed Budget', 'Variable Budget', 'Periodic Budget', 'Saving Budget'].forEach(function(cat) {
            var data = summary.budgetSummary[cat] || { allocated: 0, spent: 0 };
            var remaining = data.allocated - data.spent;
            var color = remaining < 0 ? '#EF4444' : (remaining > 0 ? '#10B981' : '#666');

            budgetHtml += `
              <div class="stat-card">
                <div class="stat-label" style="font-weight: bold; margin-bottom: 10px;">${cat}</div>
                <div style="font-size: 0.9em; display: flex; justify-content: space-between; margin-bottom: 5px;">
                  <span>Allocated:</span> <strong>${formatMoney(data.allocated)}</strong>
                </div>
                <div style="font-size: 0.9em; display: flex; justify-content: space-between; margin-bottom: 5px;">
                  <span>Spent:</span> <strong style="color: #EF4444;">${formatMoney(data.spent)}</strong>
                </div>
                <div style="font-size: 0.9em; display: flex; justify-content: space-between; margin-top: 10px; border-top: 1px solid #eee; padding-top: 5px;">
                  <span>Remaining:</span> <strong style="color: ${color};">${formatMoney(remaining)}</strong>
                </div>
              </div>
            `;
          });

          budgetHtml += '</div>';

          if (!document.getElementById('budgetSummaryContainer')) {
             var div = document.createElement('div');
             div.id = 'budgetSummaryContainer';
             container.parentNode.insertBefore(div, container.nextSibling);
          }
          document.getElementById('budgetSummaryContainer').innerHTML = budgetHtml;

        })
        .getFinanceSummary();
    }

    function loadRecords() {
      google.script.run
        .withSuccessHandler(function(records) {
          var container = document.getElementById('recordsContainer');

          if (records.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 20px;">No transactions found.</div>';
            return;
          }

          var html = `
            <table>
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>Type</th>
                  <th>Category</th>
                  <th>Amount</th>
                  <th>Note</th>
                </tr>
              </thead>
              <tbody>
          `;

          records.forEach(function(r) {
            var typeClass = r.type === 'Income' ? 'type-income' : 'type-outcome';
            var sign = r.type === 'Income' ? '+' : '-';

            html += `
              <tr>
                <td>${formatDate(r.timestamp)}</td>
                <td><span class="${typeClass}">${r.type}</span></td>
                <td>${escapeHtml(r.category)}</td>
                <td class="${typeClass}">${sign}${formatMoney(r.amount)}</td>
                <td>${escapeHtml(r.note)}</td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          container.innerHTML = html;
        })
        .getFinanceRecords();
    }

    function refreshAll() {
      loadDashboard();
      loadRecords();
      loadBudgets();
    }

    function toggleCategoryInput() {
      var type = document.getElementById('finType').value;
      if (type === 'Income') {
        document.getElementById('finCategoryText').style.display = 'block';
        document.getElementById('finCategorySelect').style.display = 'none';
      } else {
        document.getElementById('finCategoryText').style.display = 'none';
        document.getElementById('finCategorySelect').style.display = 'block';
      }
    }

    function openAddBudgetModal() {
      document.getElementById('addBudgetModal').style.display = 'flex';
    }

    function closeAddBudgetModal() {
      document.getElementById('addBudgetModal').style.display = 'none';
      document.getElementById('budgetName').value = '';
      document.getElementById('budgetAmount').value = '';
    }

    function saveBudget() {
      var data = {
        budgetName: document.getElementById('budgetName').value,
        budgetCategory: document.getElementById('budgetCategory').value,
        amount: document.getElementById('budgetAmount').value
      };

      if (!data.budgetName || !data.amount || parseFloat(data.amount) <= 0) {
        showMessage('Please enter a valid budget name and amount.', 'error');
        return;
      }

      var btn = document.getElementById('saveBudgetBtn');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = 'Save Budget';
          if (res.success) {
            closeAddBudgetModal();
            showMessage(res.message, 'success');
            refreshAll();
          } else {
            showMessage(res.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Save Budget';
          showMessage('Error: ' + err.message, 'error');
        })
        .saveBudget(data);
    }

    function openViewBudgetsModal() {
      document.getElementById('viewBudgetsModal').style.display = 'flex';
      // loadBudgets logic is handled inside refreshAll/loadBudgets automatically, but we ensure it's rendered.
    }

    function closeViewBudgetsModal() {
      document.getElementById('viewBudgetsModal').style.display = 'none';
    }

    function loadBudgets() {
      google.script.run
        .withSuccessHandler(function(budgets) {
          // 1. Populate Dropdown for Outcome
          var select = document.getElementById('finCategorySelect');
          select.innerHTML = '<option value="" disabled selected>Select Budget...</option>';
          budgets.forEach(function(b) {
            var opt = document.createElement('option');
            opt.value = b.budgetName;
            opt.text = b.budgetName + ' (' + b.budgetCategory + ')';
            select.appendChild(opt);
          });

          // 2. Populate View Budgets Modal
          var container = document.getElementById('budgetsListContainer');
          if (budgets.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 20px;">No budgets allocated yet.</div>';
            return;
          }

          var html = `
            <table>
              <thead>
                <tr>
                  <th>Budget Name</th>
                  <th>Category</th>
                  <th>Allocated</th>
                  <th>Spent</th>
                  <th>Remaining</th>
                </tr>
              </thead>
              <tbody>
          `;

          budgets.forEach(function(b) {
            var color = b.remaining < 0 ? '#EF4444' : (b.remaining > 0 ? '#10B981' : '#666');
            html += `
              <tr>
                <td><strong>${escapeHtml(b.budgetName)}</strong></td>
                <td>${escapeHtml(b.budgetCategory)}</td>
                <td>${formatMoney(b.allocated)}</td>
                <td style="color: #EF4444;">${formatMoney(b.spent)}</td>
                <td style="color: ${color}; font-weight: bold;">${formatMoney(b.remaining)}</td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          container.innerHTML = html;
        })
        .getBudgets();
    }

    function saveTransaction() {
      var type = document.getElementById('finType').value;
      var category = type === 'Income' ? document.getElementById('finCategoryText').value : document.getElementById('finCategorySelect').value;

      var data = {
        type: type,
        category: category,
        amount: document.getElementById('finAmount').value,
        note: document.getElementById('finNote').value
      };

      if (!data.category || !data.amount || parseFloat(data.amount) <= 0) {
        showMessage('Please fill in valid category and amount.', 'error');
        return;
      }

      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-save"></i> Save Transaction';

          if (res.success) {
            showMessage(res.message, 'success');
            document.getElementById('finCategory').value = '';
            document.getElementById('finAmount').value = '';
            document.getElementById('finNote').value = '';
            refreshAll();
          } else {
            showMessage(res.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-save"></i> Save Transaction';
          showMessage('Error: ' + err.message, 'error');
        })
        .saveFinanceRecord(data);
    }

    // Init
    refreshAll();
  </script>
</body>
</html>
